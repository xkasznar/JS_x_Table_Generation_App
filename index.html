<!DOCTYPE html>
<html lang = "sk-sk">
	<head>
		<meta charset="utf-8">
		<title>Generátor tabuľky hodnôt funkcie f() = X.Y - Martin Kasznár</title>
		<link href="mojecss.css" rel="stylesheet">
	</head>
	<body>
		<header>
			<h1>Generátor tabuľky hodnôt funkcie f() = X.Y</h1>
		</header>
		<article>
			<form>
				<h2>Zadajte prosím rozmery tabuľky</h2>
				<label>x</label>
				<input type="number" id="x" name="x" onchange="checkX();">
				<label>y</label>
				<input type="number" id="y" name="y" onchange="checkY();">
				<input type="button" value="Odovzdat" id="odovzdavac">
				<div id="explX">x nie je prir. cislo</div>
				<div id="explY">y nie je prir. cislo</div>
			</form>
			<div id = "vrstvaNad"></div>
		</article>
		<footer>
			Tu sa nachádza generátor tabuľky hodnôt funkcie f() = X.Y.
		</footer>
		<script src="script.js"></script>
	</body>
</html>
